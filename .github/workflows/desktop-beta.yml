# Builds PluginChek desktop beta (Windows, Linux, macOS) and attaches artifacts.
# Run manually (Actions tab) or push a tag like v0.1.0-beta.2.
name: Desktop beta build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run ${{ matrix.script }}
        env:
          # Unsigned beta. For signed builds set CSC_LINK / CSC_KEY_PASSWORD (and Apple notarisation secrets) and remove this line.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Checksums
        shell: bash
        run: cd dist && (sha256sum *.AppImage *.tar.gz *.exe *.dmg *.zip 2>/dev/null || shasum -a 256 *.dmg *.zip 2>/dev/null) > SHA256SUMS-${{ matrix.os }}.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: pluginchek-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS-*.txt
      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS-*.txt
